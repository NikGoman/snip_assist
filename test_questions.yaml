# test_questions.yaml
# Набор контрольных вопросов для валидации RAG-движка.
# Используется для автоматического и ручного тестирования.
# Формат:
# - question_id: Уникальный ID вопроса (Q001, Q002, ...)
# - question_text: Сам вопрос
# - gold_documents: Список файлов, в которых содержится правильный ответ (точное имя файла)
# - expected_answer_snippet: Каноническое перефразирование или цитата из документа (для проверки faithfulness)
# - expected_value: (опционально) Ожидаемое числовое/символьное значение (для точных величин)
# - expected_section: (опционально) Номер раздела/подраздела/таблицы/формулы

- question_id: Q001
